services:
  - type: web
    name: interviewai-api
    runtime: node
    plan: free
    buildCommand: buildCommand: npm --prefix backend ci --include=dev && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_REST_URL
        sync: false
      - key: REDIS_REST_TOKEN
        sync: false
